<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="mark-crop"><rect x="3" y="16" width="58" height="32" rx="4"/></clipPath>
    <filter id="remove-black" color-interpolation-filters="sRGB">
      <feColorMatrix in="SourceGraphic" type="luminanceToAlpha" result="alpha"/>
      <feComposite in="SourceGraphic" in2="alpha" operator="in"/>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="#07111d" stroke="#18c9e8" stroke-width="2"/>
  <g clip-path="url(#mark-crop)" filter="url(#remove-black)">
    <image href="assets/logo-kuronami.jpg" x="-30.25" y="0.9" width="118.8" height="79.2" preserveAspectRatio="none"/>
  </g>
</svg>
